name: Release Drafter

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Fork PRs need a base-repository token to apply labels.
  pull_request_target:
    types: [ opened, reopened, synchronize ]

jobs:
  autolabel_pull_requests:
    name: Autolabel pull requests
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Keep this job free of PR checkouts and code execution.
      - name: Autolabel
        uses: release-drafter/release-drafter/autolabeler@v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_release_draft:
    name: Update release draft
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Release
        uses: release-drafter/release-drafter@v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
